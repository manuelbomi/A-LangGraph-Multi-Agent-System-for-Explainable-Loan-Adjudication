[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "credit-underwriting-decision-graph"
version = "0.1.0"
description = "A LangGraph multi-agent system for explainable, human-in-the-loop loan adjudication (portfolio demo, synthetic data only)."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Portfolio Author" }]

dependencies = [
    "langgraph==1.0.10rc1",
    "langgraph-checkpoint==4.1.1",
    "langgraph-checkpoint-sqlite==3.0.1",
    "langchain-core==1.3.3",
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "tenacity==9.0.0",
    "python-dotenv==1.2.2",
    "python-json-logger==2.0.7",
    "httpx==0.27.2",
]

[project.optional-dependencies]
# Only required if a reviewer wants to exercise a real hosted LLM provider.
# The default demo/test path never imports these -- see src/underwriting/infrastructure/llm.py.
providers = [
    "langchain-openai==1.1.14",
    "langchain-anthropic==1.4.6",
]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.7.4",
    "mypy==1.13.0",
    "types-requests==2.32.0.20241016",
]

[tool.hatch.build.targets.wheel]
packages = ["src/underwriting"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["tests/", "\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
