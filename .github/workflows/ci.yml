# CI pipeline: lint -> type-check -> unit tests -> docker build.
#
# Runs entirely offline -- no secrets are required or referenced anywhere
# in this workflow. The test suite forces the offline MockChatModel path
# regardless of the runner's environment (see tests/conftest.py), so this
# pipeline never depends on, or could accidentally leak, a real API key.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type-check (mypy)
        run: mypy src

      - name: Unit + integration tests (pytest)
        run: pytest -v --maxfail=1

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push -- CI validates the build only)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: credit-underwriting-decision-graph:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
