# Deployment for the underwriting API.
#
# Pinned at replicas=1 deliberately: the shipped checkpointer is SQLite on
# a ReadWriteOnce PVC (see pvc.yaml), which only one pod can safely write
# to. Scaling out requires swapping to a Postgres-backed checkpointer first
# (see README "Key Design Decisions" and deploy/OPENSHIFT.md) -- the HPA in
# hpa.yaml is included to show the intended production pattern, with that
# prerequisite called out explicitly rather than silently shipping
# something that would corrupt state under concurrent writers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: underwriting-api
  labels:
    app.kubernetes.io/name: credit-underwriting-decision-graph
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: credit-underwriting-decision-graph
  template:
    metadata:
      labels:
        app.kubernetes.io/name: credit-underwriting-decision-graph
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: underwriting-api
          image: credit-underwriting-decision-graph:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: underwriting-config
            - secretRef:
                name: underwriting-secrets
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # /app/data must be writable for the checkpoint DB
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: checkpoint-data
              mountPath: /app/data
      volumes:
        - name: checkpoint-data
          persistentVolumeClaim:
            claimName: underwriting-checkpoint-data
